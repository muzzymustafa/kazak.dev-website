<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0F1A">
    <title>Taskative — Join Team</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0F1A;
            --surface-1: #131826;
            --surface-2: #1A2032;
            --outline: rgba(255,255,255,0.08);
            --outline-strong: rgba(255,255,255,0.14);
            --text: #E8ECF5;
            --text-muted: #9AA4BC;
            --text-dim: #6B7388;
            --warmth: #FFD58E;
            --warmth-strong: #FFB347;
            --danger: #FCA5A5;
            --danger-bg: rgba(252,165,165,0.10);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            font-feature-settings: 'cv11';
            font-variant-numeric: tabular-nums;
            background: var(--bg);
            background-image:
                radial-gradient(900px 500px at 80% -10%, rgba(255,179,71,0.10), transparent 60%),
                radial-gradient(700px 400px at -10% 30%, rgba(91,141,239,0.08), transparent 60%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: var(--surface-1);
            border: 1px solid var(--outline);
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.04) inset;
        }
        .logo {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--warmth-strong), var(--warmth));
            border-radius: 20px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 36px rgba(255,179,71,0.32);
        }
        .logo svg { width: 42px; height: 42px; }
        .logo svg path { stroke: #1a0f00; }
        h1 {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.55;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--surface-2);
            border-top-color: var(--warmth);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 12px;
            transition: transform 200ms cubic-bezier(.2,.7,.2,1), box-shadow 200ms cubic-bezier(.2,.7,.2,1), background 200ms;
            border: 1px solid transparent;
            cursor: pointer;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary {
            background: linear-gradient(135deg, var(--warmth-strong), var(--warmth));
            color: #1a0f00;
            box-shadow: 0 12px 32px rgba(255,179,71,0.30);
        }
        .btn-primary:hover { box-shadow: 0 16px 40px rgba(255,179,71,0.40); }
        .btn-secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--outline-strong);
        }
        .btn-secondary:hover {
            background: var(--surface-2);
            border-color: var(--warmth);
            color: var(--warmth);
        }
        .footer-note {
            margin-top: 22px;
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.55;
        }
        .error-msg {
            color: var(--danger);
            font-size: 0.88rem;
            padding: 12px 14px;
            background: var(--danger-bg);
            border: 1px solid rgba(252,165,165,0.25);
            border-radius: 12px;
            margin-bottom: 16px;
            display: none;
            text-align: left;
        }
        .error-msg.visible { display: block; }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M5 12l5 5L20 7" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>
        <h1>Join your team</h1>
        <p class="subtitle">Opening Taskative… If nothing happens, tap the button below.</p>
        <div id="errorMsg" class="error-msg"></div>
        <div class="spinner" id="spinner"></div>
        <a id="openApp" class="btn btn-primary" href="#">Open Taskative</a>
        <a id="playStore" class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.taskative">Get it on Play Store</a>
        <p class="footer-note">After installing, open the invite link again to join your team automatically.</p>
    </div>
    <script>
        (function() {
            var path = window.location.pathname;
            var parts = path.split('/join/');
            var sessionId = parts[1] ? parts[1].replace(/\/+$/, '').split('?')[0] : '';
            var storeUrl = 'https://play.google.com/store/apps/details?id=com.taskative';

            if (!sessionId) {
                document.getElementById('errorMsg').textContent = 'Invalid invite link. Redirecting to Play Store…';
                document.getElementById('errorMsg').classList.add('visible');
                document.getElementById('spinner').style.display = 'none';
                setTimeout(function() { window.location = storeUrl; }, 2000);
                return;
            }

            // HTTPS App Links: the full kazak.dev URL IS the deep link.
            // On Android with verified Digital Asset Links, OS routes directly to app.
            // For in-app browsers (WhatsApp, etc.) that don't auto-route, we wrap in intent://.
            var httpsUrl = window.location.href;
            var intentUrl = 'intent://kazak.dev/taskative/join/' + sessionId +
                '#Intent;scheme=https;package=com.taskative;' +
                'S.browser_fallback_url=' + encodeURIComponent(storeUrl) + ';end';

            var isAndroid = /android/i.test(navigator.userAgent);
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

            // Primary button: intent URL for Android, https URL for others
            document.getElementById('openApp').href = isAndroid ? intentUrl : httpsUrl;

            // Auto-attempt to open the app.
            // On Android, App Links should route the HTTPS URL directly to the app
            // if Digital Asset Links verification succeeded at install time. But if the
            // user clicks from WhatsApp (in-app browser) or the app was installed BEFORE
            // assetlinks.json was live, verification may fail — we fall back to intent://.
            if (isAndroid) {
                window.location = intentUrl;
                // After 2 seconds, if still on this page (app didn't open), the button
                // is already visible as manual fallback — hide spinner to reduce confusion.
                setTimeout(function() {
                    document.getElementById('spinner').style.display = 'none';
                    document.querySelector('.subtitle').textContent =
                        'Tap "Open Taskative" below. If not installed, use the Play Store button.';
                }, 2000);
            } else if (isIOS) {
                // iOS: app not published yet — show store immediately
                document.getElementById('spinner').style.display = 'none';
                document.querySelector('.subtitle').textContent = 'Taskative is available on Google Play.';
            } else {
                // Desktop: hide spinner, let user pick via buttons
                document.getElementById('spinner').style.display = 'none';
                document.querySelector('.subtitle').textContent =
                    'Open this link on your Android device to join the team.';
            }
        })();
    </script>
</body>
</html>
