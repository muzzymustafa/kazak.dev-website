<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B0F1A">
    <title>MojiSpy - Friend Invite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0B0F1A;
            --surface-1: #131826;
            --surface-2: #1A2032;
            --outline: rgba(255,255,255,0.08);
            --outline-strong: rgba(255,255,255,0.14);
            --text: #E8ECF5;
            --text-muted: #9AA4BC;
            --text-dim: #6B7388;
            --warmth: #FFD58E;
            --warmth-strong: #FFB347;
            --warmth-dim: rgba(255,213,142,0.14);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            font-feature-settings: 'cv11';
            background: var(--bg);
            background-image:
                radial-gradient(900px 500px at 80% -10%, rgba(255,179,71,0.14), transparent 60%),
                radial-gradient(700px 400px at -10% 30%, rgba(91,141,239,0.06), transparent 60%);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 16px;
            -webkit-font-smoothing: antialiased;
        }
        .card {
            background: var(--surface-1);
            border: 1px solid var(--outline);
            border-radius: 24px;
            padding: 48px 32px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 24px 80px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.04) inset;
        }
        .emoji {
            font-size: 64px;
            margin-bottom: 16px;
            filter: drop-shadow(0 8px 20px rgba(255,179,71,0.5));
        }
        h1 {
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text);
            margin-bottom: 8px;
        }
        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 14px;
            line-height: 1.55;
        }
        .reward-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: var(--warmth-dim);
            color: var(--warmth);
            border: 1px solid rgba(255,213,142,0.28);
            font-size: 0.82rem;
            font-weight: 700;
            padding: 8px 16px;
            border-radius: 999px;
            margin-bottom: 26px;
            letter-spacing: 0.02em;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 3px solid var(--surface-2);
            border-top-color: var(--warmth);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 24px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            font-family: inherit;
            font-size: 0.98rem;
            font-weight: 700;
            text-decoration: none;
            margin-bottom: 12px;
            transition: transform 200ms cubic-bezier(.2,.7,.2,1), box-shadow 200ms cubic-bezier(.2,.7,.2,1);
            border: 1px solid transparent;
            cursor: pointer;
        }
        .btn:hover { transform: translateY(-2px); }
        .btn-primary {
            background: linear-gradient(135deg, var(--warmth-strong), var(--warmth));
            color: #1a0f00;
            box-shadow: 0 12px 32px rgba(255,179,71,0.32);
        }
        .btn-primary:hover { box-shadow: 0 16px 40px rgba(255,179,71,0.42); }
        .btn-secondary {
            background: transparent;
            color: var(--text);
            border-color: var(--outline-strong);
        }
        .btn-secondary:hover {
            background: var(--surface-2);
            border-color: var(--warmth);
            color: var(--warmth);
        }
        .footer-note {
            margin-top: 22px;
            font-size: 0.8rem;
            color: var(--text-dim);
            line-height: 1.55;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🎁</div>
        <h1>Your friend invited you!</h1>
        <p class="subtitle">Join MojiSpy and get a welcome bonus.</p>
        <div class="reward-badge">🪙 +100 Coins on signup</div>
        <div class="spinner"></div>
        <a id="openApp" class="btn btn-primary" href="#">Open MojiSpy</a>
        <a id="playStore" class="btn btn-secondary" href="https://play.google.com/store/apps/details?id=com.mojispy.game">Install on Play Store</a>
        <p class="footer-note">If the app doesn't open automatically, tap "Open MojiSpy" or install it from the Play Store.</p>
    </div>
    <script>
        (function() {
            var parts = window.location.pathname.split('/ref/');
            var code = parts[1] ? parts[1].replace(/\/+$/, '') : '';
            var appUrl = 'mojispy://ref/' + code;
            var storeUrl = 'https://play.google.com/store/apps/details?id=com.mojispy.game';

            document.getElementById('openApp').href = appUrl;

            // Attempt to open the app
            window.location = appUrl;

            // If still here after 2500ms, redirect to Play Store
            setTimeout(function() {
                window.location = storeUrl;
            }, 2500);
        })();
    </script>
</body>
</html>
